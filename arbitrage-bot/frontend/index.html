<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arbitrage Bot Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app compact-mode">
        <!-- Top Bar -->
        <header class="top-bar">
            <div class="top-bar-left">
                <div class="logo">
                    <div class="logo-icon">⚡</div>
                    <span class="logo-text">Arbitrage Bot</span>
                </div>
            </div>
            
            <div class="top-bar-center">
                <div class="key-stats">
                    <div class="key-stat">
                        <i class="fas fa-bolt"></i>
                        <span id="oppCount">0</span>
                        <small>Opportunities</small>
                    </div>
                    <div class="key-stat success">
                        <i class="fas fa-arrow-up"></i>
                        <span id="profitableCount">0</span>
                        <small>Profitable</small>
                    </div>
                    <div class="key-stat">
                        <i class="fas fa-chart-line"></i>
                        <span id="bestEdge">--</span>
                        <small>Best Edge</small>
                    </div>
                    <div class="key-stat">
                        <i class="fas fa-server"></i>
                        <span id="totalMarkets">0</span>
                        <small>Markets</small>
                    </div>
                </div>
            </div>
            
            <div class="top-bar-right">
                <div class="connection-status">
                    <div class="status-indicator" id="connectionStatus">
                        <div class="status-dot"></div>
                        <span class="status-text">Connecting...</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Dashboard -->
        <main class="dashboard">
            <!-- Left Panel: Triangle Status Grid -->
            <section class="panel triangle-grid-panel">
                <div class="panel-header">
                    <h3><i class="fas fa-th"></i> Triangle Status</h3>
                    <div class="search-mini">
                        <input type="text" id="triangleSearch" placeholder="Filter..." class="search-mini-input">
                    </div>
                </div>
                <div class="panel-content">
                    <div id="triangleGrid" class="triangle-grid">
                        <!-- Triangle status tiles will be populated here -->
                    </div>
                </div>
            </section>

            <!-- Center Panel: Best Opportunities -->
            <section class="panel opportunities-panel">
                <div class="panel-header">
                    <h3><i class="fas fa-trophy"></i> Top Opportunities</h3>
                    <div class="filter-tabs">
                        <button class="filter-tab active" data-filter="all">All</button>
                        <button class="filter-tab" data-filter="profitable">Profitable</button>
                        <button class="filter-tab" data-filter="near">Near-Miss</button>
                    </div>
                </div>
                <div class="panel-content">
                    <div id="topOpportunities" class="opportunities-compact">
                        <div class="no-data-compact">
                            <i class="fas fa-clock"></i>
                            <p>Waiting for opportunities...</p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Right Panel: Selected Market Orderbook -->
            <section class="panel orderbook-panel">
                <div class="panel-header">
                    <h3 id="currentMarket"><i class="fas fa-book"></i> Market: BTCINR</h3>
                    <select id="marketSelect" class="market-select-mini">
                        <option value="">Loading...</option>
                    </select>
                </div>
                <div class="panel-content">
                    <div class="orderbook-compact">
                        <div class="orderbook-side-compact asks-compact">
                            <div class="side-label">Asks</div>
                            <div id="asksList" class="orders-compact">
                                <div class="no-data-compact">No data</div>
                            </div>
                        </div>
                        
                        <div class="spread-compact">
                            <div id="spreadValue" class="spread-value-compact">--</div>
                            <div class="spread-label-compact">Spread</div>
                        </div>
                        
                        <div class="orderbook-side-compact bids-compact">
                            <div class="side-label">Bids</div>
                            <div id="bidsList" class="orders-compact">
                                <div class="no-data-compact">No data</div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Bottom Status Bar -->
        <footer class="status-bar">
            <div class="status-item">
                <i class="fas fa-clock"></i>
                <span id="lastUpdate">--</span>
            </div>
            <div class="status-item">
                <i class="fas fa-database"></i>
                <span id="dataPoints">0</span> data points
            </div>
            <div class="status-item">
                <i class="fas fa-tachometer-alt"></i>
                <span id="tickRate">0</span> ticks/s
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
