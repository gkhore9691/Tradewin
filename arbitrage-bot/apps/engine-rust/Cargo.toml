[package]
name = "arbitrage-engine"
version = "0.1.0"
edition = "2021"
authors = ["Arbitrage Bot Team"]
description = "Ultra-low-latency triangle arbitrage engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Async runtime
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"

# Decimal arithmetic
rust_decimal = "1.32"
rust_decimal_macros = "1.32"

# Unix Domain Sockets
tokio-uds = "0.2"

# Metrics
prometheus = "0.13"
prometheus_exporter = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Configuration
config = "0.13"
toml = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Collections
dashmap = "5.5"
indexmap = "2.0"

# Utilities
uuid = { version = "1.6", features = ["v4"] }
once_cell = "1.19"

# Threading
crossbeam-channel = "0.5"
rayon = "1.8"

# Math
num-traits = "0.2"

[dev-dependencies]
criterion = "0.5"
proptest = "1.3"

[[bench]]
name = "triangle_evaluation"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
debug = true
